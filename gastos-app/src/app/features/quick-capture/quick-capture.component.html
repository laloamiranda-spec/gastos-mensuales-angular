<!-- Contenedor MODAL (overlay dentro de la app) -->
<div class="qc-overlay" *ngIf="mode === 'modal'" (click)="onOverlayClick($event)">
  <div class="qc-modal" (click)="$event.stopPropagation()">
    <ng-container [ngTemplateOutlet]="wizard"></ng-container>
  </div>
</div>

<!-- Contenedor PÁGINA (ruta a pantalla completa) -->
<div class="qc-page" *ngIf="mode === 'page'">
  <div class="qc-page-inner">
    <ng-container [ngTemplateOutlet]="wizard"></ng-container>
  </div>
</div>

<ng-template #wizard>

  <!-- Header -->
  <div class="qc-header">
    <div class="qc-steps">
      <div class="qc-step" [class.active]="step >= 1" [class.done]="step > 1">
        <div class="qc-step-dot"></div>
        <span class="qc-step-label">Gasto</span>
      </div>
      <div class="qc-step-line" [class.done]="step > 1"></div>
      <div class="qc-step" [class.active]="step >= 2">
        <div class="qc-step-dot"></div>
        <span class="qc-step-label">Confirmar</span>
      </div>
    </div>
    <button class="qc-close" (click)="cancel()">✕</button>
  </div>

  <!-- Step 1: Monto + Categoría + Detalle -->
  <div class="qc-body" *ngIf="step === 1">
    <div class="qc-step-title">¿Cuánto gastaste?</div>
    <div class="qc-step-subtitle">Ingresa el monto, elige la categoría y describe el gasto</div>

    <!-- Monto -->
    <div class="qc-amount-wrapper">
      <span class="qc-currency">$</span>
      <input
        #amountInput
        class="qc-amount-input"
        type="number"
        inputmode="decimal"
        [(ngModel)]="amount"
        placeholder="0.00"
        step="0.01"
        min="0"
      />
      <span class="qc-currency-label">MXN</span>
    </div>
    <!-- Categoría -->
    <label class="form-label" style="display:block;margin:20px 0 10px;">¿En qué gastaste?</label>
    <div class="qc-category-grid">
      <button
        *ngFor="let cat of categories"
        class="qc-cat-btn"
        [class.selected]="selectedCategoryId === cat.id"
        [style.--cat-color]="cat.color"
        (click)="selectCategory(cat)"
      >
        <span class="qc-cat-icon">{{ cat.icon }}</span>
        <span class="qc-cat-name">{{ cat.name }}</span>
      </button>
      <button
        class="qc-cat-btn"
        [class.selected]="selectedCategoryId === ''"
        [style.--cat-color]="'#6b7280'"
        (click)="selectCategory(null)"
      >
        <span class="qc-cat-icon">📦</span>
        <span class="qc-cat-name">Otros</span>
      </button>
    </div>

    <!-- Detalle -->
    <div class="form-group" style="margin:20px 0 0;">
      <label class="form-label">Descripción *</label>
      <input
        class="form-control"
        [(ngModel)]="description"
        placeholder="Ej. Despensa, gasolina, farmacia..."
        (keydown.enter)="canProceed() && next()"
      />
    </div>

    <!-- Foto del ticket (opcional) -->
    <div class="qc-photo-row">
      <button type="button" class="qc-photo-btn" [class.has-photo]="ticketPreview" (click)="triggerFileInput()">
        <span *ngIf="!ticketPreview">📷 Agregar foto del ticket (opcional)</span>
        <span *ngIf="ticketPreview">✓ Ticket adjunto — toca para cambiar</span>
      </button>
      <button type="button" *ngIf="ticketPreview" class="qc-photo-remove" (click)="removePhoto($event)">✕</button>
      <input
        #fileInput
        type="file"
        accept="image/*"
        capture="environment"
        style="display:none"
        (change)="onFileSelected($event)"
      />
    </div>
    <img *ngIf="ticketPreview" [src]="ticketPreview" class="qc-ticket-img" alt="Ticket" style="margin-top:10px;" />
  </div>

  <!-- Step 2: Confirmar -->
  <div class="qc-body" *ngIf="step === 2">
    <div class="qc-step-title">Confirma el gasto</div>
    <div class="qc-step-subtitle">Revisa y ajusta los últimos datos</div>

    <div class="qc-summary-card">
      <div class="qc-summary-amount mono">${{ amount | number:'1.2-2' }}</div>
      <div class="qc-summary-desc">{{ description }}</div>
      <div class="qc-summary-cat" *ngIf="selectedCategory">
        <span>{{ selectedCategory.icon }}</span>
        <span>{{ selectedCategory.name }}</span>
      </div>
      <div class="qc-summary-ticket" *ngIf="ticketPreview">
        <img [src]="ticketPreview" class="qc-summary-thumb" alt="Ticket" />
        <span>Ticket adjunto</span>
      </div>
    </div>

    <div class="form-group" style="margin-top:16px;">
      <label class="form-label">Miembro</label>
      <div class="qc-chips">
        <button type="button" class="qc-chip" [class.selected]="selectedMemberId === ''" (click)="selectedMemberId = ''">
          Sin asignar
        </button>
        <button
          type="button"
          class="qc-chip"
          *ngFor="let m of members"
          [class.selected]="selectedMemberId === m.id"
          (click)="selectedMemberId = m.id || ''"
        >
          <span class="qc-chip-dot" [style.background]="m.avatar_color"></span>
          {{ m.name }}
        </button>
      </div>
    </div>

    <div class="form-group" style="margin-top:12px;">
      <label class="form-label">Forma de pago</label>
      <div class="qc-chips">
        <button type="button" class="qc-chip" [class.selected]="selectedPaymentMethodId === ''" (click)="selectedPaymentMethodId = ''">
          Sin especificar
        </button>
        <button
          type="button"
          class="qc-chip"
          *ngFor="let pm of paymentMethods"
          [class.selected]="selectedPaymentMethodId === pm.id"
          (click)="selectedPaymentMethodId = pm.id || ''"
        >
          {{ getPaymentMethodIcon(pm.type) }} {{ pm.name }}
        </button>
      </div>
    </div>

    <div class="form-group" style="margin-top:12px;">
      <label class="form-label">Fecha del gasto</label>
      <input class="form-control mono" type="date" [(ngModel)]="expenseDate" />
    </div>

    <div class="qc-paid-toggle">
      <span class="qc-paid-label">¿Ya está pagado?</span>
      <div class="qc-toggle-btns">
        <button class="btn btn-sm" [class.btn-primary]="!isPaid" [class.btn-secondary]="isPaid" (click)="isPaid = false">Pendiente</button>
        <button class="btn btn-sm" [class.btn-primary]="isPaid" [class.btn-secondary]="!isPaid" (click)="isPaid = true">Pagado</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="qc-footer">
    <button class="btn btn-secondary" (click)="back()" *ngIf="step > 1 && !saving">
      ← Atrás
    </button>
    <button class="btn btn-secondary" (click)="cancel()" *ngIf="step === 1">
      Cancelar
    </button>

    <div class="qc-footer-right">
      <button
        *ngIf="step < 2"
        class="btn btn-primary qc-next-btn"
        (click)="next()"
        [disabled]="!canProceed()"
      >
        Siguiente →
      </button>
      <button
        *ngIf="step === 2"
        class="btn btn-primary qc-next-btn"
        (click)="save()"
        [disabled]="saving || !description || !amount"
      >
        <span *ngIf="!saving">✓ Guardar gasto</span>
        <span *ngIf="saving">Guardando...</span>
      </button>
    </div>
  </div>

</ng-template>
