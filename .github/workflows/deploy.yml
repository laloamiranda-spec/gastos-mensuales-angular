name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gastos-app/package-lock.json

      - name: Install dependencies
        working-directory: gastos-app
        run: npm ci

      - name: Build
        working-directory: gastos-app
        run: npm run build -- --base-href /gastos-mensuales-angular/

      - name: SPA fallback (404.html)
        # GitHub Pages no reescribe rutas: sin esto, recargar /inicio u otra ruta da 404.
        # Copiamos index.html como 404.html para que Angular resuelva la ruta en el cliente.
        run: cp gastos-app/dist/gastos-mensuales/browser/index.html gastos-app/dist/gastos-mensuales/browser/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gastos-app/dist/gastos-mensuales/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
